name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ezbet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ezbet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/ezbet_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install API package
        run: pip install .

      - name: Compile API sources
        run: python -m py_compile app/*.py

      - name: Test API behavior
        run: python -m unittest discover -s services/api/tests -v
        working-directory: ${{ github.workspace }}
